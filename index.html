    </div>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;">Think about that for a second, because you've lived it a thousand times.</p>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;">Every time you walk into a department store and someone asks, "Hey, how can I help you?" — you say no. Then five minutes later you're asking them where to find the pair of shoes you came in for. Every time you're scrolling Amazon and you see a <strong>Sponsored</strong> tag next to an item, you subconsciously skip it — and then after looking around, you scroll right back to that same item.</p>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:18px;">That's natural sales resistance. It's not rational — it's reflexive. And it's exactly what your customers are doing when they throw out these early responses on the phone. They're not giving you a real position on Verizon or their phone plan. They're putting up a wall because a stranger called them, and the first instinct is to push that stranger away.</p>

    <div class="insight-card">
      <div class="insight-label">Mental Model</div>
      <h4>The Good Lawyer</h4>
      <p>Think of these customers sometimes like a good lawyer. A skilled lawyer asks a question not because they want the answer — they ask it to get you to reveal something that might not be in your favor. Customers naturally do this. They'll say something that <em>sounds</em> like a concern or a problem, but really it's bait — a red herring designed to get you to over-explain, get defensive, or give them an excuse to hang up. These defense mechanisms are thrown out fast, early, and without much thought behind them. If you take the bait and treat a smoke screen like a real objection, you're doing exactly what the customer wanted — you gave them a reason to disengage. The trick is learning to recognize what you're actually hearing before you respond to it.</p>
    </div>

    <div class="section-tag">What's Next</div>
    <h2 style="font-size:22px;color:#1d1d1f;margin:22px 0 14px;">Drill Into Each Bucket</h2>
    <div class="scard-grid">
      <a class="scard sec-pitch" data-obj-sub="questions">
        <div class="scard-icon">❓</div>
        <h3>Questions</h3>
        <p>The sign of a good customer. Answer tight, stay in control.</p>
        <div class="scard-cta">Open module</div>
      </a>
      <a class="scard sec-pitch" data-obj-sub="smokescreens" style="--accent:#ff9500;--accent-2:#ffcc00;--accent-soft:rgba(255,149,0,0.08);--accent-ring:rgba(255,149,0,0.25);">
        <div class="scard-icon">💨</div>
        <h3>Smoke Screens</h3>
        <p>Word vomit. Acknowledge it, move past it, don't feed it.</p>
        <div class="scard-cta">Open module</div>
      </a>
      <a class="scard sec-pitch" data-obj-sub="objections" style="--accent:#ff3b30;--accent-2:#ff6961;--accent-soft:rgba(255,59,48,0.08);--accent-ring:rgba(255,59,48,0.25);">
        <div class="scard-icon">⚔️</div>
        <h3>Objections</h3>
        <p>Real barriers. Discover, reason, redirect.</p>
        <div class="scard-cta">Open module</div>
      </a>
    </div>
  `;
  content.querySelectorAll('[data-obj-sub]').forEach(el => {
    el.addEventListener('click', () => {
      currentSub = el.dataset.objSub;
      render();
    });
  });
}

function renderQuestionsPage() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="sec-hero">
      <div class="crumb">The Pitch · Handling Objections · Questions</div>
      <span class="sec-tag">The Buying Signal</span>
      <h1>Questions</h1>
      <p class="lead">Questions are what you're listening for. A customer asking questions is a customer who's engaged, thinking logistically, and considering how this would actually work for them. That's a buying signal — embrace it.</p>
    </div>

    <div class="section-tag">Mindset</div>
    <h2 style="font-size:24px;color:#1d1d1f;margin:4px 0 10px;">Why Questions Are a Good Sign</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;">If you have a customer who's not asking you any sort of questions — just going with the flow, agreeing with everything — those are the customers you need to take a step back and dig into. Silence isn't agreement; it's usually indifference. The customer who asks questions is the one who's actually considering it.</p>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:20px;">Think about every time you've bought something serious. Cell phones run our lives — did you buy yours without asking a single question? If you walked into a car dealership, wouldn't you ask about gas mileage, how many miles it has, how it drives? You ask questions every time you're genuinely considering a purchase. Your customers are doing the exact same thing.</p>

    <div class="section-tag">What to listen for</div>
    <h2 style="font-size:24px;color:#1d1d1f;margin:22px 0 10px;">What Questions Sound Like</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;">Questions are typically logistical and practical — the customer is thinking about fit, not looking for an exit:</p>
    <ul style="color:#1d1d1f;font-size:15.5px;line-height:1.8;margin:0 0 16px;padding-left:22px;">
      <li><em>"Hey, do you know how the service is in my area?"</em></li>
      <li><em>"I'm paying off phones — how do you guys pay those off?"</em></li>
      <li><em>"Do you have any deals on new phones?"</em></li>
      <li><em>"Do you work for Verizon corporate?"</em></li>
    </ul>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:18px;">If you treat any of these like an actual objection — getting defensive or launching into a long explanation — you'll create resistance that wasn't there. The customer asked a simple question. Keep it simple.</p>

    <div class="section-tag">The play</div>
    <h2 style="font-size:24px;color:#1d1d1f;margin:22px 0 14px;">The Pattern: Question → Short Answer → Question</h2>
    <div class="flow-diagram">
      <div class="flow-step">
        <div class="flow-num">1</div>
        <h4>Acknowledge with your own question</h4>
        <p>Lob a short follow-up back at <em>their</em> question. Puts you back in control immediately and signals you actually care about getting the right answer.</p>
      </div>
      <div class="flow-step">
        <div class="flow-num">2</div>
        <h4>Give a short, casual answer</h4>
        <p>Based on what they told you. Don't use ten words when three will do. Less is more.</p>
      </div>
      <div class="flow-step">
        <div class="flow-num">3</div>
        <h4>Ask a question that moves the pitch forward</h4>
        <p>Never end your answer on a period — end it with a question. Control stays with the person asking.</p>
      </div>
    </div>

    <div class="insight-card">
      <div class="insight-label">Why this works</div>
      <h4>Leading with a question back = credibility</h4>
      <p>If someone asks <em>"What's the coverage like in my area?"</em> and you immediately say <em>"Oh dude, the coverage is absolutely fantastic"</em> — it doesn't ring true. Sounds like a salesman who'd say that no matter what. But if you say <em>"Well, where do you live?"</em> → they say Phoenix → <em>"Yeah, that's fine — you won't have any issues"</em> — now it <strong>lands</strong>. You asked before you answered. The customer feels like you actually checked instead of feeding them a line.</p>
    </div>

    <div class="section-tag">Walkthrough</div>
    <h2 style="font-size:22px;color:#1d1d1f;margin:22px 0 14px;">Example — "How's the service in my area?"</h2>
    <div style="background:#f5f5f7;border-radius:14px;padding:24px 28px;margin-bottom:20px;">
      <p style="margin:0 0 10px;"><strong>Customer:</strong> <em>"How's the service in my area?"</em></p>
      <p style="margin:0 0 10px;"><strong>You:</strong> "Yeah, let's take a look — you live in the Phoenix area, right?"</p>
      <p style="margin:0 0 10px;color:#6e6e73;"><em>(wait for response)</em></p>
      <p style="margin:0 0 10px;"><strong>You:</strong> "Oh yeah, it's fine. You don't live in North Dakota." <em style="color:#6e6e73;">(light tone — puts a bow on it, signals 'this isn't a concern')</em></p>
      <p style="margin:0;"><strong>You:</strong> "How long have you had T-Mobile?"</p>
      <p style="margin-top:14px; color:#86868b; font-size:14px;">You acknowledged their question, gathered info, gave a short casual answer, and immediately moved the conversation forward with a question of your own. You never lost control.</p>
    </div>

    <div class="pull-quote">
      Questions = interest. Silence = skepticism. A customer who doesn't ask questions likely wasn't serious in the first place.
      <cite>— The Two-Question Rule</cite>
    </div>

    <div class="insight-card">
      <div class="insight-label">The Two-Question Rule</div>
      <h4>Let them ask up to two — on the third, pivot to the appointment</h4>
      <p>General rule when you're setting: let the customer ask up to two questions. Each time, follow the pattern — acknowledge, short answer, your question. On the third question, that's your push for the appointment:</p>
      <div class="cmp-quote" style="margin-top:12px;">"Hey, that's a great question. Really, I'm just a scout here — my job is to see who's open to the idea and who might actually be a good fit. What does your schedule look like tomorrow afternoon?"</div>
      <p style="margin-top:14px;">Welcome the questions, keep your answers tight, and always be the one asking the next question.</p>
    </div>
  `;
}

function renderSmokescreensPage() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="sec-hero" style="background:linear-gradient(135deg,#ff9500 0%,#ffcc00 100%);box-shadow:0 8px 30px rgba(255,149,0,0.25);">
      <div class="crumb">The Pitch · Handling Objections · Smoke Screens</div>
      <span class="sec-tag">Defense Mechanism Disguised As Objection</span>
      <h1>Smoke Screens</h1>
      <p class="lead">Everybody loves smoke screens. This is absolute word vomit — it can be ignored almost in its entirety. A smoke screen is something disguised as an objection that's really just a defense mechanism. No real teeth. Easy to move past, as long as you recognize what you're hearing.</p>
    </div>

    <div class="section-tag" style="color:#ff9500;background:rgba(255,149,0,0.08);">What to listen for</div>
    <h2 style="font-size:24px;color:#1d1d1f;margin:4px 0 10px;">What Smoke Screens Sound Like</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;">These are the most common things you'll hear that <em>sound</em> like they need a real response — but they don't. Not the first time.</p>
    <ul style="color:#1d1d1f;font-size:15.5px;line-height:1.8;margin:0 0 16px;padding-left:22px;">
      <li><em>"Hey, I'm busy right now."</em></li>
      <li><em>"I've had T-Mobile for 30 years."</em> / <em>"I've had AT&T for 30 years."</em></li>
      <li><em>"I still owe money on my phones."</em></li>
      <li><em>"I got a good deal — it comes with free Netflix."</em></li>
      <li><em>"I don't do business over the phone."</em></li>
    </ul>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:20px;">Some of these sound like solid objections that need to be addressed. They don't — not yet. They're reflexes. The customer threw them out without much thought behind them, hoping it'd be enough to make you go away.</p>

    <div class="insight-card" style="--accent:#ff9500;--accent-2:#ffcc00;--accent-soft:rgba(255,149,0,0.08);--accent-ring:rgba(255,149,0,0.25);">
      <div class="insight-label">How to handle them</div>
      <h4>Acknowledge briefly. Don't feed it.</h4>
      <p>Ask a question that progresses the conversation. <strong>Don't give it more attention than it's worth, because then it grows.</strong></p>
    </div>

    <div class="flow-diagram">
      <div class="flow-step" style="border-left:4px solid #ff9500;">
        <div class="flow-num" style="background:linear-gradient(135deg,#ff9500,#ffcc00);">A</div>
        <h4>"I've had T-Mobile for 30 years"</h4>
        <p>→ "Totally understand — what made you sign up with T-Mobile in the first place? Do you remember?" <em>(acknowledge + move forward with a question)</em></p>
      </div>
      <div class="flow-step" style="border-left:4px solid #ff9500;">
        <div class="flow-num" style="background:linear-gradient(135deg,#ff9500,#ffcc00);">B</div>
        <h4>"I'm busy"</h4>
        <p>→ "Yeah, totally understand. This is pretty surface level —" then ask a question and keep moving into the pitch.</p>
      </div>
      <div class="flow-step" style="border-left:4px solid #ff9500;">
        <div class="flow-num" style="background:linear-gradient(135deg,#ff9500,#ffcc00);">C</div>
        <h4>"I still owe on my phones"</h4>
        <p>→ "Gotcha — how many phones are you paying off right now?" <em>(gathering info, not defending)</em></p>
      </div>
    </div>

    <div class="section-tag" style="color:#ff9500;background:rgba(255,149,0,0.08);">The Key Distinction</div>
    <h2 style="font-size:24px;color:#1d1d1f;margin:22px 0 10px;">Smoke Screen vs. Real Concern</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:20px;">A smoke screen gets thrown out once, casually, as a reflex. If the customer brings it up <strong>again</strong> with more specificity and urgency, it's escalating out of smoke screen territory and into something that needs to be handled differently.</p>

    <h3 style="font-size:18px;color:#1d1d1f;margin:0 0 14px;">Example — "I'm Busy"</h3>
    <div class="dd-grid">
      <div class="dd-col do" style="border-left:4px solid #ff9500;">
        <h4 style="color:#ff9500;">First time — Smoke screen</h4>
        <ul style="list-style:none;padding:0;">
          <li style="padding:0 0 10px;border:none;"><em>"Hey man, I'm really busy today. Now's not a great time."</em></li>
          <li style="padding:0;border:none;">→ Acknowledge lightly: <em>"Yeah, totally understand — this is pretty surface level,"</em> then ask a question and keep moving into the pitch.</li>
        </ul>
      </div>
      <div class="dd-col dont">
        <h4>Second time — Now it's real</h4>
        <ul style="list-style:none;padding:0;">
          <li style="padding:0 0 10px;border:none;"><em>"No, seriously man, I'm at a job site right now. I gotta go."</em></li>
          <li style="padding:0;border:none;">→ No longer a smoke screen. Repeated with real context + urgency. Now it's an objection — offer a callback.</li>
        </ul>
      </div>
    </div>

    <div class="pull-quote">
      The customer will tell you when something actually matters to them — they'll bring it back. Your job is not to be the one who makes it matter before they do.
      <cite>— The smoke-screen rule</cite>
    </div>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:6px;">As a setter, the vast majority of what you'll deal with is smoke screens. Get comfortable moving past them quickly, and you'll notice your conversations get longer and your sets get stronger.</p>
  `;
}

function renderObjectionsPage() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="sec-hero" style="background:linear-gradient(135deg,#ff3b30 0%,#ff6961 100%);box-shadow:0 8px 30px rgba(255,59,48,0.25);">
      <div class="crumb">The Pitch · Handling Objections · Objections</div>
      <span class="sec-tag">Real Barriers To The Sale</span>
      <h1>Objections</h1>
      <p class="lead">Objections are where deals die — but more often than not, the deal was actually lost in the moments <em>leading up to</em> the objection. Most objections are avoidable. The ones that aren't need to be handled with a specific method.</p>
    </div>

    <div class="insight-card" style="--accent:#ff3b30;--accent-2:#ff6961;--accent-soft:rgba(255,59,48,0.08);--accent-ring:rgba(255,59,48,0.25);">
      <div class="insight-label">Mental model</div>
      <h4>The 8 Mile Principle</h4>
      <p>If you've seen the movie <em>8 Mile</em>, you've seen the final rap battle where Eminem takes every shot at himself before his opponent can say a word. He said everything the other guy could have said against him — left him speechless, with nothing to do but give up the mic and walk away.</p>
      <p style="margin-top:10px;">Following a sales process does the same thing. When you address potential concerns proactively during the pitch — before the customer raises them — you <strong>"8 Mile" the objection</strong>. You take it off the table before it ever becomes a problem.</p>
      <p style="margin-top:10px;"><strong>The best way to handle an objection is to make sure you don't get it in the first place.</strong> If you're getting the same objections over and over again, that's a sign something in your process needs adjusting.</p>
    </div>

    <div class="section-tag" style="color:#ff3b30;background:rgba(255,59,48,0.08);">Definition</div>
    <h2 style="font-size:24px;color:#1d1d1f;margin:4px 0 10px;">What Makes It an Objection</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:20px;">An objection is a genuine barrier that <strong>must</strong> be overcome in order for the customer to move forward. It's not a reflex (that's a smoke screen). It's not curiosity (that's a question). It's a real problem in the customer's mind that will kill the deal if you don't address it.</p>

    <div class="pull-quote">
      When in doubt, default to smoke screen. Wait for the customer to bring it back with weight before you give it weight yourself.
      <cite>— The default rule</cite>
    </div>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:18px;">This is especially true <strong>early in the pitch</strong>. The later you are in the sale, the more likely something is a real objection. As a setter, you're mostly working early in the conversation — so most of what you hear is smoke screens, not objections. But you need to know how to handle the real ones when they come.</p>

    <div class="section-tag" style="color:#ff3b30;background:rgba(255,59,48,0.08);">What to listen for</div>
    <h2 style="font-size:24px;color:#1d1d1f;margin:22px 0 10px;">Common Objections</h2>
    <ul style="color:#1d1d1f;font-size:15.5px;line-height:1.8;margin:0 0 20px;padding-left:22px;">
      <li><em>"I had Verizon in the past and my coverage was terrible — I was dropping calls constantly."</em></li>
      <li><em>"I don't have the best credit. I don't want to have to pay big down payments."</em></li>
      <li><em>"My spouse handles the account — I can't make that decision on my own."</em></li>
      <li><em>"I'm locked into a contract with my current carrier."</em></li>
      <li><em>"I tried switching once and it was a nightmare — porting took weeks and I lost my number."</em></li>
    </ul>

    <div class="dd-grid">
      <div class="dd-col dont">
        <h4>What NOT To Do</h4>
        <ul style="list-style:none;padding:0;">
          <li style="padding:8px 0 8px 26px;position:relative;border:none;"><span style="position:absolute;left:2px;top:8px;color:#ff3b30;font-weight:700;">✕</span>Dive into a rant about network improvements or $40B of tower infrastructure</li>
          <li style="padding:8px 0 8px 26px;position:relative;border-top:1px solid #f0f0f3;"><span style="position:absolute;left:2px;top:8px;color:#ff3b30;font-weight:700;">✕</span>Get defensive or sound like a salesman</li>
          <li style="padding:8px 0 8px 26px;position:relative;border-top:1px solid #f0f0f3;"><span style="position:absolute;left:2px;top:8px;color:#ff3b30;font-weight:700;">✕</span>Use ten words when three will do</li>
          <li style="padding:8px 0 8px 26px;position:relative;border-top:1px solid #f0f0f3;"><span style="position:absolute;left:2px;top:8px;color:#ff3b30;font-weight:700;">✕</span>Lose control while you're busy talking</li>
        </ul>
      </div>
      <div class="dd-col do">
        <h4>The Reason Redirect Method</h4>
        <ul style="list-style:none;padding:0;">
          <li style="padding:8px 0 8px 26px;position:relative;border:none;"><span style="position:absolute;left:2px;top:8px;color:#34c759;font-weight:700;">1.</span><strong>Question (Discovery)</strong> — ask before you answer. Control first.</li>
          <li style="padding:8px 0 8px 26px;position:relative;border-top:1px solid #f0f0f3;"><span style="position:absolute;left:2px;top:8px;color:#34c759;font-weight:700;">2.</span><strong>Reason (Short + Logical)</strong> — a brief, tailored response. Not a rant.</li>
          <li style="padding:8px 0 8px 26px;position:relative;border-top:1px solid #f0f0f3;"><span style="position:absolute;left:2px;top:8px;color:#34c759;font-weight:700;">3.</span><strong>Redirect (Move Forward)</strong> — ask a question that gets past the objection.</li>
        </ul>
      </div>
    </div>

    <div class="insight-card" style="--accent:#ff3b30;--accent-2:#ff6961;--accent-soft:rgba(255,59,48,0.08);--accent-ring:rgba(255,59,48,0.25);">
      <div class="insight-label">Why the question comes first</div>
      <p>You need control of the conversation before you can reason with anyone. The discovery question also changes your answer — "10 years ago" is a very different situation than "6 months ago," and your reasoning needs to match. Skip the question and you're guessing, and it sounds like a script.</p>
    </div>

    <div class="section-tag" style="color:#ff3b30;background:rgba(255,59,48,0.08);">Walkthrough</div>
    <h2 style="font-size:22px;color:#1d1d1f;margin:22px 0 14px;">Full Example — "I had Verizon and I was dropping calls constantly"</h2>
    <div style="background:#f5f5f7;border-radius:14px;padding:24px 28px;margin-bottom:20px;">
      <p style="margin:0 0 8px;"><strong>Step 1 — Question (Discovery):</strong></p>
      <p style="margin:0 0 6px;">"Oh man, yeah — nobody likes dropping calls. How long ago was it that you had Verizon?"</p>
      <p style="margin:0 0 14px;color:#6e6e73;"><em>(or: "How long have you had T-Mobile now?" — both get you the same answer)</em></p>

      <p style="margin:0 0 14px;"><strong>Customer:</strong> "About 10 years ago."</p>

      <p style="margin:0 0 8px;"><strong>Step 2 — Reason (Short, Logical):</strong></p>
      <p style="margin:0 0 14px;"><em>(light laugh)</em> "Yeah, I mean that makes sense — 10 years ago I think everybody was kind of dropping calls a good amount. I'm sure you've noticed even T-Mobile's made major improvements since then. Verizon today is the top choice for network reliability and holds the record for 35 consecutive J.D. Power Network Quality Awards"</p>

      <p style="margin:0 0 8px;"><strong>Step 3 — Redirect:</strong></p>
      <p style="margin:0 0 12px;">"Setting aside some of the service issues you had in the past — if the deal made sense, would you be opposed to at least considering it?"</p>

      <p style="margin:0;color:#86868b;font-size:14px;">You gathered information with a question, gave a reasonable and logical answer tailored to what they told you, and then redirected the conversation forward. You never ranted, never got defensive, and you stayed in control the whole time.</p>
    </div>

    <div class="pull-quote">
      Most objections are avoidable by following the process — 8 Mile them before they come up. The ones that do come up: Question → Reason → Redirect.
      <cite>— The big picture</cite>
    </div>
  `;
}

function renderWhyATTPage() {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="sec-hero">
      <div class="crumb">Product Knowledge · Why Verizon Business</div>
      <span class="sec-tag">The Switching Angle</span>
      <h1>Why Verizon Business</h1>
      <p class="lead">We're not here to tell people Verizon is better than their carrier. We're here to show them that being a <em>new customer</em> is where the money is — and that switching their personal plan to a business plan unlocks prices they didn't know existed.</p>
    </div>

    <div class="pull-quote">
      People keep their cell phone company longer than they keep their marriages — and the most loyal customers are the ones paying the most.
      <cite>— The running joke in wireless</cite>
    </div>

    <div class="section-tag">The core insight</div>
    <h2 style="font-size:24px;color:#1d1d1f;margin:4px 0 10px;">The Loyalty Tax</h2>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;">It's true — customers stay with the same carrier for 5, 10, even 20 years without ever questioning the bill. The irony is that <strong>the most loyal customers are the ones paying the most.</strong></p>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:12px;">Think about it from the carrier's perspective. Every carrier — Verizon, Verizon, T-Mobile — spends billions on new customer promotions. Free phones, discounted plans, waived fees. Where does the money come from to fund all those deals? It comes from the customers who already signed up years ago and never left. The loyal base floats the bill for the red carpet that gets rolled out for new customers.</p>
    <p style="color:#424245;font-size:15.5px;line-height:1.65;margin-bottom:18px;">The customers with the lowest bills at any carrier are almost always the ones who <em>just</em> switched over. Their promos are fresh, their phones are new, and they locked in the latest pricing. Meanwhile, the customer who's been there for a decade? Their promos expired years ago, their plan is outdated, and they're quietly overpaying every single month.</p>

    <div class="insight-card">
      <div class="insight-label">Real Example</div>
      <h4>The T-Mobile Customer</h4>
      <p>A customer Trever just spoke to. He'd been with T-Mobile for 3 years. All of his promotions had expired. He had 3 phones on the account, all paid off, and was paying just under <strong>$200/month</strong>. One of the things he liked about T-Mobile was the free Office 365 plan included as a perk on his account — he thought that was a great benefit he didn't want to lose.</p>
      <p>Here's the thing: the Office 365 plan included with his T-Mobile account costs <strong>$2/month</strong> retail. That's what he was holding onto.</p>
      <p>With Verizon, we were going to get him <strong>2 brand-new phones</strong>, keep his third phone, and drop his bill down to <strong>$100/month</strong>. That's half the bill, new devices, and the only "perk" he was giving up costs less than a cup of coffee.</p>
      <p>That's not because Verizon is a better company. It's because <strong>he'd be a new customer</strong>, and new customers get the red carpet. His T-Mobile loyalty was costing him $100/month.</p>
    </div>

    <div class="content-block">
      <h3>It's Not "Verizon Is Better" — It's "New Customers Win"</h3>
      <p>This is an important mindset for the call floor. We are not pitching Verizon as a superior network to Verizon or T-Mobile. If your prospect is on one of the Big Three, their coverage is going to be essentially the same no matter which one they're on. You might have some pockets here and there that are slightly better with one carrier, but the reality is they're all the same experience.</p>
      <p>What <em>is</em> different is where the customer sits in the cycle. A customer who just switched to any carrier is at the best pricing that carrier offers. A customer who's been there for years is at the worst. Our job is to help people realize that <strong>becoming a new customer again is where the savings are</strong>. The red carpet gets rolled out for you every time you switch — and it disappears the longer you stay.</p>
      <p>When a prospect says "I'm happy with my service" — great. We're not saying their service is bad. We're saying their <em>price</em> is bad, because they've been there long enough for all the good deals to expire. That's the angle.</p>
    </div>

    <div class="content-block">
      <h3>The Business Plan Conversion</h3>
      <p>The other piece of this — and you'll hear it constantly on the phones — is customers who own a business but have their phones on a personal plan. They'll say things like:</p>
      <ul>
        <li><em>"I don't really have employees — it's just me."</em></li>
        <li><em>"It's kind of a personal phone and a business phone."</em></li>
        <li><em>"It's just my wife and kids on my plan, so I don't need a business account."</em></li>
        <li><em>"I don't want an extra expense."</em></li>
      </ul>
      <p>They're thinking of a "business account" as some separate, additional thing — like we're asking them to add a second plan on top of what they already have. That's not what we're doing at all.</p>
      <p>What we're actually doing is <strong>converting their existing personal plan into a business plan</strong> — same phones, same numbers, same lines — but now it's classified as a business account because they have an LLC (or a sole proprietorship, or an EIN). And business plans have <strong>lower per-line pricing</strong> than consumer plans. That's it. We're not adding anything. We're reclassifying what they already have so they pay less.</p>
      <p>A lot of small-business owners don't even realize this is an option. They think "business phone plan" means a giant corporate account with 50 lines and a dedicated account rep. In reality, a business plan can be 1 line — their phone, on a business rate, because they have a business. That's the whole play.</p>
    </div>

    <div class="takeaway-box">
      <h3>How to Frame It on the Phone</h3>
      <p>You don't need to memorize a script for this — you need to understand the <em>logic</em> so it comes out naturally. Here's the core framework:</p>
      <ul>
        <li><strong>If they've been with their carrier for a while →</strong> "The people paying the least at [their carrier] are the ones who just signed up. The longer you stay, the more you end up paying — all the promos expire and the bill just creeps up. Right now with Verizon, since you'd be a brand-new customer, you get the best pricing they offer."</li>
        <li><strong>If they push back with "I like my carrier" →</strong> "Totally get it — and honestly, coverage-wise, the Big Three are all pretty much the same. The difference is just where you are in the cycle. New customers always get the best deals, and the loyal customers end up floating the bill for those deals."</li>
        <li><strong>If they have a business but are on a personal plan →</strong> "Since you've got an LLC, we're not adding anything new — we're just converting your plan to a business account, which gets you lower rates. Same phones, same numbers, just a lower bill."</li>
      </ul>
    </div>
  `;
}

      </div>
    </div>

    <div class="content-block" style="display:flex;gap:16px;align-items:flex-start;">
      <div style="background:#0071e3;color:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;">2</div>
      <div>
        <h3 style="margin-bottom:4px;">What was the situation?</h3>
        <p>Were they busy? In the middle of something? In an office, on a job site, driving? This tells the closer what kind of energy to expect when they call back. Someone who was rushing between meetings is a different conversation than someone who was relaxed at their desk.</p>

        </div>
        <div style="background:#ffffff;border:1px solid #d2d2d7;border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:12px;">
          <span style="font-size:20px;">📡</span>
          <div>
            <div style="font-weight:600;color:#1d1d1f;font-size:15px;">Does not already have Verizon</div>
            <div style="color:#86868b;font-size:13px;">If they're already on Verizon, there's no switch to make. That should've been caught in discovery and dispo'd as Not Qualified.</div>
          </div>
        </div>
        <div style="background:#ffffff;border:1px solid #d2d2d7;border-radius:10px;padding:14px 18px;display:flex;align-items:center;gap:12px;">
          <span style="font-size:20px;">👤</span>
          <div>
            <div style="font-weight:600;color:#1d1d1f;font-size:15px;">Spoke with the decision maker</div>
            <div style="color:#86868b;font-size:13px;">A 10-minute call with a receptionist who "sounds interested" does not count. The closer must speak with the person who has authority to make changes on the account.</div>
          </div>
        </div>
      </div>
    </div>

    <div class="cmp-danger" style="margin-top:20px;">
      <strong>The #1 dispositioning mistake:</strong> marking a call as Not Interested when it should be DNC. If the customer said anything resembling "take me off your list" or "don't call again," that's a DNC — not a Not Interested. Getting this wrong means someone else calls them tomorrow, and that's where TCPA lawsuits start. When in doubt, DNC it.
    </div>
  `;
}

/* ------- Dedicated quiz pages (own sidebar tabs) ------- */
function renderQuizPage(quizId, crumb, heroTitle, heroLead, heroStats) {
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="sec-hero">
      <div class="section-tag">${crumb}</div>
      <h1>${heroTitle}</h1>
      <p class="lead">${heroLead}</p>
      <div class="hero-stats">
        ${heroStats.map(s => `<div class="hero-stat"><div class="hs-num">${s.n}</div><div class="hs-lbl">${s.l}</div></div>`).join('')}
      </div>
    </div>
    ${renderQuiz(quizId)}
  `;
}

/* ------- Main router ------- */
function render() {
  renderTopNav();
  renderSidebar();
  if (currentSection === 'home') {
    renderHome();
  } else if (currentSection === 'pitch' && currentSub === 'solidifying') {
    renderSolidifyingPage();
  } else if (currentSection === 'pitch' && currentSub === 'obj-overview') {
    renderObjOverviewPage();
  } else if (currentSection === 'pitch' && currentSub === 'questions') {
    renderQuestionsPage();
  } else if (currentSection === 'pitch' && currentSub === 'smokescreens') {
    renderSmokescreensPage();
  } else if (currentSection === 'pitch' && currentSub === 'objections') {
    renderObjectionsPage();
  } else if (currentSection === 'pitch' && currentSub === 'obj-quiz') {
    renderObjectionsQuizPage();
  } else if (currentSection === 'pitch' && currentSub === 'pitch-quiz') {
    renderPitchQuizPage();
  } else if (currentSection === 'product' && currentSub === 'terminology') {
    renderTerminologyPage();
  } else if (currentSection === 'product' && currentSub === 'competition') {
    renderCompetitionPage();
  } else if (currentSection === 'product' && currentSub === 'why-vz') {
    renderWhyATTPage();
  } else if (currentSection === 'compliance') {
    renderCompliancePage();
    applySectionAccent();
    bindQuizHandlers();
    return; // renderer handles scroll
  } else if (currentSection === 'dialer' && currentSub === 'login') {
    renderReadyModeBasicsPage();
  } else if (currentSection === 'dialer' && currentSub === 'dispositions') {
    renderDispositionsPage();
  } else if (currentSection === 'dialer' && currentSub === 'quirks') {
    renderCommonQuirksPage();
  } else if (currentSection === 'dialer' && currentSub === 'dialer-quiz') {
    renderDialerQuizPage();
  } else if (currentSection === 'booking' && currentSub === 'live') {
    renderBookItLivePage();
  } else if (currentSection === 'booking' && currentSub === 'warm-transfer') {
    renderWarmTransferPage();
  } else if (currentSection === 'booking' && currentSub === 'sms') {
    renderSMSConsentPage();
  } else if (currentSection === 'booking' && currentSub === 'handoff') {
    renderHandoffToCloserPage();
  } else if (currentSection === 'booking' && currentSub === 'booking-quiz') {
    renderBookingQuizPage();
  } else if (currentSection === 'top-reps' && currentSub === 'challenger') {
    renderChallengerPage();
  } else if (currentSection === 'top-reps' && currentSub === 'schedule') {
    renderSchedulePowerHourPage();
  } else {
    renderPlaceholderPage();
  }
  // Apply section accent class to content container
  applySectionAccent();
  // Bind quiz + checklist handlers for any newly-rendered pages
  bindQuizHandlers();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function applySectionAccent() {
  const content = document.getElementById('content');
  if (!content) return;
  const map = {
    'home': 'sec-home',
    'pitch': 'sec-pitch',
    'dialer': 'sec-dialer',
    'booking': 'sec-booking',
    'product': 'sec-product',
    'top-reps': 'sec-toprep',
    'compliance': 'sec'
  };
  content.classList.remove('sec','sec-home','sec-pitch','sec-dialer','sec-booking','sec-product','sec-toprep');
  content.classList.add('sec');
  if (map[currentSection]) content.classList.add(map[currentSection]);
}

// init
(function() {
  currentSection = 'home';
  currentSub = null;
  render();
})();
</script>
